# Digitsell: send subscription links (/link/<token>) through the patch, which adds the
# status rows and, for Happ, the direct routes (Iran and chosen sites).
# Skipped for the patch's own fetch of the panel's link (header X-Sub-Raw) and for its
# fallback redirect back to the panel's link (query nosub=1), so nothing loops.
set $digitsell_sub "";
if ($uri ~ "^/link/[A-Za-z0-9_-]+/?$") { set $digitsell_sub "1"; }
if ($http_x_sub_raw != "") { set $digitsell_sub ""; }
if ($arg_nosub != "") { set $digitsell_sub ""; }
if ($digitsell_sub = "1") { rewrite ^/link/([A-Za-z0-9_-]+)/?$ /xmplus-patch.php?do=sub&t=$1 last; }
